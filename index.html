<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090d0c" />
    <meta name="description" content="A beautiful, private chess game. Choose your dark colour theme and play against a bot from 100 to 3000 Elo." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FreeChess" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" sizes="72x72" href="/icons/icon-72.svg" type="image/svg+xml" />
    <link rel="icon" sizes="96x96" href="/icons/icon-96.svg" type="image/svg+xml" />
    <link rel="icon" sizes="128x128" href="/icons/icon-128.svg" type="image/svg+xml" />
    <link rel="icon" sizes="192x192" href="/icons/icon-192.svg" type="image/svg+xml" />
    <link rel="icon" sizes="256x256" href="/icons/icon-256.svg" type="image/svg+xml" />
    <link rel="icon" sizes="512x512" href="/icons/icon-512.svg" type="image/svg+xml" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/icons/icon.svg" />
    <title>FreeChess — Your next move</title>
  
    <!-- FreeToolz responsive baseline: compact, expanded and foldable viewports; no dependencies. -->
    <style>
      html { min-width: 0; max-width: 100%; overflow-x: clip; }
      body { min-width: 0; max-width: 100%; overflow-x: clip; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
      #root, #app, main, header, footer, section, article, aside, nav, form { min-width: 0; }
      img, video, canvas, iframe { max-width: 100%; }
      input, select, textarea, button { max-width: 100%; }
      pre, .code-block, .code-editor, .editor-pane, .output-pane { min-width: 0; max-width: 100%; overflow-x: auto; }
      table { max-width: 100%; }
      @media (max-width: 760px) {
        .tool-grid, .tools-grid, .feature-grid, .features-grid, .cards-grid, .home-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
        .workspace-layout, .tool-layout, .app-layout, .split-layout { min-width: 0; }
        input, select, textarea { font-size: max(16px, 1em); }
        button, [role="button"], input[type="button"], input[type="submit"] { touch-action: manipulation; }
      }
      @media (horizontal-viewport-segments: 2) {
        :root { --foldable-left-segment-width: env(viewport-segment-width 0 0, 100vw); --foldable-right-segment-width: env(viewport-segment-width 1 0, 0px); }
      }
      @media (vertical-viewport-segments: 2) {
        :root { --foldable-top-segment-height: env(viewport-segment-height 0 0, 100vh); --foldable-bottom-segment-height: env(viewport-segment-height 0 1, 0px); }
      }
    </style>
<meta name="google-site-verification" content="XtWwH9os0_9mIIGXasQQGTXxMqjQKsafidvUz956G4E" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
